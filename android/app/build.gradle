plugins {
    id "com.android.application"
}

android {
    namespace "local.xunzhan.phone"
    compileSdk 35
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "local.xunzhan.phone"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["libnode/bin"]
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
